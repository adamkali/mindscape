info:
  contact:
    name: Adam Kalinowski
    url: https://github.com/adamkali/mindscape
  description: This is the swagger page for the Project mindscape generated with Egg-go.
    use this to test your database connection
  license:
    name: MIT
  title: mindscape
  version: 0.0.1
paths:
  /apikeys:
    get:
      description: List all API Keys for the current user
      operationId: ListApiKeys
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.ApiKeysResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ApiKeysResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ApiKeysResponse'
      security:
      - BearerAuth: []
      summary: List API Keys
      tags:
      - ApiKeys
    post:
      consumes:
      - application/json
      description: Create a new API Key for programmatic access
      operationId: CreateApiKey
      parameters:
      - description: CreateApiKeyRequest
        in: body
        name: CreateApiKeyRequest
        required: true
        schema:
          $ref: '#/definitions/CreateApiKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.ApiKeyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ApiKeyResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ApiKeyResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ApiKeyResponse'
      security:
      - BearerAuth: []
      summary: Create a new API Key
      tags:
      - ApiKeys
  /apikeys/{keyId}:
    delete:
      description: Delete an API Key by its ID
      operationId: DeleteApiKey
      parameters:
      - description: API Key ID
        in: path
        name: keyId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/StringResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/StringResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/StringResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/StringResponse'
      security:
      - BearerAuth: []
      summary: Delete an API Key
      tags:
      - ApiKeys
  /background:
    get:
      description: Get Default Background
      operationId: GetDefaultBackground
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/StringResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/StringResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/StringResponse'
      summary: Get Default Background
      tags:
      - Background
  /background/choices:
    get:
      description: Get Background Choices
      operationId: GetBackgroundChoices
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BackgroundResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/BackgroundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/BackgroundResponse'
      summary: Get Background Choices that ae loaded into the server.
      tags:
      - Background
  /bookmarks:
    patch:
      consumes:
      - application/json
      description: |-
        Move a Bookmark by Authorization Header, and my a
        ParentFolderId [parent_id].
